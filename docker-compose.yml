services:
  web:
    build:
      context: .
      target: development
    command: ./bin/dev
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_DB: erp_sig_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      SIDEKIQ_REDIS_URL: redis://redis:6379/2
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
      - node_modules:/rails/node_modules
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

  sidekiq:
    build:
      context: .
      target: development
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_DB: erp_sig_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/1
      SIDEKIQ_REDIS_URL: redis://redis:6379/2
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_sig_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  bundle:
  node_modules:
  postgres_data:
